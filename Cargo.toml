[workspace]
resolver = "2"
members = [
    "packages/blueflame", 
    "packages/blueflame-deps", 
    "packages/blueflame-proc-macros", 
    "packages/manual",
    "packages/parser", 
    "packages/runtime",
    "packages/runtime-tests",
    "packages/runtime-wasm",
    "packages/skybook-api",
]

[workspace.dependencies]
bit-set = "0.10.0"
bitfield-struct = "0.13.0"
cached = "0.59.0"
catppuccin = "2.8.0"
crc32fast = "1.5.0"
enumset = "1.1.12"
enum-map = "2.7.3"
flate2 = { version = "1.1.9", default-features = false }
hashlink = "0.11.0"
indoc = "2.0.7"
mdbook = "0.4.52"
num-traits = "0.2.19"
oneshot = "0.1.13"
paste = "1.0.15" # TODO --cleanup: do we need this?
phf = "0.13.1"
rand_xoshiro = "0.8.0"
rkyv = "0.8.16"
serde = "1"
sha2 = "0.10.9"
static_assertions = "1.1.0"
teleparse = "0.1.2"
textdistance = "1.1.1"
thiserror = "2.0.18"
tokio = "1"

# Rust-Web ecosystem
js-sys = "0.3.98"
web-sys = "0.3.98"
ts-rs = "11.1.0"
tsify = { version = "0.5.6", features = ["js"], default-features = false }
wasm-bindgen = { version = "0.2.121", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.71"
wasm-bindgen-spawn = "0.0.5"
console_log = "1.0.0"
console_error_panic_hook = "0.1.7"

[workspace.dependencies.cu]
package = "pistonite-cu"
version = "0.8.2"

[workspace.dependencies.pm]
package = "pistonite-pm"
version = "0.2.6"

[workspace.dependencies.disarm64]
package = "disarm64-custom"
git = "https://github.com/Pistonite/disarm64-custom"
branch = "main"
version = "0.1.5"
