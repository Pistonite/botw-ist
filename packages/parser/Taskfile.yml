version: '3'

includes:
  cargo:
    taskfile: ../../node_modules/mono-dev/task/cargo.yaml
    optional: true
    internal: true

tasks:
  bsource:
    cmds:
      - uv run scripts/build-armor-upgrade.py

  test:
    - cargo test

  test-parse:
    - cargo test --test parse

  update-parse-test:
    desc: Update parser tests snapshots
    aliases: [upt]
    env:
      UPDATE_PARSER_SNAPSHOTS: 1
    cmds:
      - cargo test --test parse

  check:
    - task: cargo:clippy-all
    - task: check-layer
    - task: cargo:fmt-check

  check-layer:
    - layered-crate -- check --lib --all-features

  fix:
    - task: cargo:fmt-fix

  diff:
    desc: Diff parser snapshots
    cmds:
      - delta tests/parse/{{.CLI_ARGS}} tests/parse/wip/{{.CLI_ARGS}}
