[package]
name = "skybook-parser"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies.skybook-api]
path = "../skybook-api"

[dependencies]
cu = {workspace = true, features = ["derive", "serde"] }
serde.workspace = true
enumset.workspace = true
static_assertions.workspace = true
teleparse.workspace = true
textdistance.workspace = true
thiserror.workspace = true

cached = { workspace = true, optional = true }

[dev-dependencies]
cu.workspace = true
indoc.workspace = true
tokio = { workspace = true, features = ["full"] }

[build-dependencies]
cu = {workspace = true, features = ["yaml", "fs"] }

[features]
wasm = ["skybook-api/wasm"]
cached = ["dep:cached"]

# This enables the `leak` and `from_raw` functions
# For passing ParseOutput objects to external code
unsafe-leak = []

