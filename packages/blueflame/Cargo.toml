[package]
name = "blueflame"
version = "0.0.0"
edition = "2024"

[dependencies.blueflame-deps]
path = "../blueflame-deps"

[dependencies.blueflame-proc-macros]
path = "../blueflame-proc-macros"

[dependencies]
cu={workspace = true, features = ["serde", "derive"]}
disarm64={ workspace=true, optional = true}
serde.workspace = true
enumset.workspace = true
rand_xoshiro.workspace = true
sha2.workspace = true
thiserror.workspace = true
paste.workspace = true
crc32fast.workspace = true
static_assertions.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] } # explicitly request pure-rust backend
phf = { workspace = true, features = ["macros"] }
enum-map.workspace = true
num-traits.workspace = true
bit-set.workspace = true
rkyv.workspace = true
bitfield-struct.workspace = true



[lib]
name = "blueflame"
path = "src/lib.rs"

[features]
default = [
    "data",
    "disarm",
    # "trace-register",
    # "trace-memory",
    # "trace-call",
]

disarm = ["dep:disarm64"]
data = ["blueflame-deps/data"]

# The trace-* features control what log::trace! statements are kept
# These are mainly used for debugging
trace-register = []
trace-memory = []
trace-memory-no-auto-commit = ["trace-memory"] # use this in multithreaded memory trace and commit yourself to avoid contention
trace-call = []
