[package]
name = "skybook-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies.blueflame]
path = "../blueflame"

[dependencies.skybook-parser]
path = "../parser"

[dependencies.skybook-api]
path = "../skybook-api"

[dependencies]
hashlink.workspace = true
cu.workspace = true
oneshot.workspace = true
oneshot.features = ["std", "async"]
serde.workspace = true
thiserror.workspace = true
static_assertions.workspace = true

# TS/WASM dependencies
web-sys = { workspace = true, features = ["console"], optional = true }
wasm-bindgen-spawn= {workspace = true, optional = true}

[features]
# default = ["wasm"]
wasm = [
    "skybook-api/wasm",
    "dep:wasm-bindgen-spawn",
    "dep:web-sys",
]
trace-memory = ["blueflame/trace-memory-no-auto-commit"]
unsafe-leak = []
