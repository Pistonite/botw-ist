[package]
name = "skybook-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies.blueflame]
path = "../blueflame"

[dependencies.skybook-parser]
path = "../parser"

[dependencies.skybook-api]
path = "../skybook-api"

[dependencies]
derive_more.workspace = true
hashlink = "0.10.0"
cu.workspace = true
oneshot.workspace = true
serde.workspace = true
thiserror.workspace = true
static_assertions.workspace = true

# TS/WASM dependencies
web-sys = { version = "0.3.77", features = ["console"], optional = true }

[dependencies.wasm-bindgen-spawn]
version = "0.0.5"
optional = true
# path = "../../../wasm-bindgen-spawn"

[features]
# default = ["wasm"]
wasm = [
    "skybook-api/wasm",
    "dep:wasm-bindgen-spawn",
    "dep:web-sys",
]
trace-memory = ["blueflame/trace-memory-no-auto-commit"]
unsafe-leak = []
