[workspace]
resolver = "2"
members = [
    "tools/video",
    "tools/sprite",
]

[workspace.dependencies.cu]
package = "pistonite-cu"
version = "0.9.2"

[workspace.dependencies]
codize = "0.3.3"
serde = "1"
image = "0.25.10"
webp = "0.3.1"
webp-animation = { version = "0.10.0", features = ["image"] }
itertools = "0.15.0"
